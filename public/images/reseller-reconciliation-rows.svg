<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" font-family="'Heiti TC','Noto Sans SC','Hiragino Sans GB','PingFang TC',sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1000" height="450" fill="#f7f9fc"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2b45">賬單三類行與勾稽關係</text>

  <!-- source -->
  <rect x="350" y="66" width="300" height="58" rx="10" fill="#ffe9d6" stroke="#F5A623" stroke-width="2"/>
  <text x="500" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#B34700">賬單明細（實例級 · 24 列）</text>
  <text x="500" y="112" text-anchor="middle" font-size="11" fill="#8a5a2a">GetMonthlyBill / SubscriptionBill</text>

  <!-- three row types -->
  <rect x="40" y="180" width="280" height="92" rx="10" fill="#e8f6ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="180" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#1d6b3f">消費行 Consume</text>
  <text x="180" y="228" text-anchor="middle" font-size="11" fill="#3f7a58">逐行勾稽：Pretax = Orig − Disc − Coupon − SPN</text>
  <text x="180" y="248" text-anchor="middle" font-size="11" fill="#3f7a58">參與折扣率比對與匯總</text>

  <rect x="360" y="180" width="280" height="92" rx="10" fill="#fff6e5" stroke="#c98a2b" stroke-width="2"/>
  <text x="500" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#8a5a10">尾差行 Rounding-Down</text>
  <text x="500" y="228" text-anchor="middle" font-size="11" fill="#9a6a20">Orig/Disc = 0；Pretax 為負尾差</text>
  <text x="500" y="248" text-anchor="middle" font-size="11" fill="#9a6a20">精度最高 10 位小數</text>

  <rect x="680" y="180" width="280" height="92" rx="10" fill="#fdeaea" stroke="#c94b4b" stroke-width="2"/>
  <text x="820" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#8a1f1f">退款行 Refund</text>
  <text x="820" y="228" text-anchor="middle" font-size="11" fill="#9a3a3a">Orig 負值、Disc = 0</text>
  <text x="820" y="248" text-anchor="middle" font-size="11" fill="#9a3a3a">淨額紅沖，不回填折扣</text>

  <!-- arrows source -> types -->
  <path d="M430,124 L430,150 L180,150 L180,178" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="500" y1="124" x2="500" y2="178" stroke="#555" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M570,124 L570,150 L820,150 L820,178" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a1)"/>

  <!-- aggregate -->
  <rect x="200" y="320" width="600" height="62" rx="10" fill="#eaf3ff" stroke="#3b6ea5" stroke-width="2"/>
  <text x="500" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2b45">客戶淨額 = Σ 三類行 Pretax</text>
  <text x="500" y="368" text-anchor="middle" font-size="12" fill="#3b6ea5">應付 = 淨額 × (1 + ratio)　（產品級費率分段計算）</text>

  <!-- arrows types -> aggregate -->
  <path d="M180,272 L180,300 L350,300 L350,318" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="500" y1="272" x2="500" y2="318" stroke="#555" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M820,272 L820,300 L650,300 L650,318" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a1)"/>

  <!-- check note -->
  <text x="500" y="416" text-anchor="middle" font-size="12" fill="#8a3040">入庫勾稽校驗：Σ(Orig−Disc−Coupon−SPN) − ΣPretax 應等於 Σ尾差行，不平則告警</text>
</svg>
