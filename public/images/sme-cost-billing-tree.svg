<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="760" viewBox="0 0 2000 760" font-family="'Heiti TC','Noto Sans SC','Hiragino Sans GB','PingFang TC',sans-serif">
  <rect x="0" y="0" width="2000" height="760" fill="#F2F5F9"/>
  <text x="1000" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#16324F">按工作負載特徵選擇計費模型</text>

  <!-- root -->
  <rect x="760" y="90" width="480" height="76" rx="12" fill="#DCE9F7" stroke="#1F4E79" stroke-width="3"/>
  <text x="1000" y="137" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F4E79">工作負載特徵判斷</text>

  <!-- stem + spine -->
  <line x1="1000" y1="166" x2="1000" y2="230" stroke="#5A6B7B" stroke-width="3"/>
  <line x1="260" y1="230" x2="1740" y2="230" stroke="#5A6B7B" stroke-width="3"/>

  <!-- drops with manual arrowheads -->
  <line x1="260" y1="230" x2="260" y2="302" stroke="#5A6B7B" stroke-width="3"/>
  <polygon points="260,318 251,300 269,300" fill="#5A6B7B"/>
  <line x1="630" y1="230" x2="630" y2="302" stroke="#5A6B7B" stroke-width="3"/>
  <polygon points="630,318 621,300 639,300" fill="#5A6B7B"/>
  <line x1="1000" y1="230" x2="1000" y2="302" stroke="#5A6B7B" stroke-width="3"/>
  <polygon points="1000,318 991,300 1009,300" fill="#5A6B7B"/>
  <line x1="1370" y1="230" x2="1370" y2="302" stroke="#5A6B7B" stroke-width="3"/>
  <polygon points="1370,318 1361,300 1379,300" fill="#5A6B7B"/>
  <line x1="1740" y1="230" x2="1740" y2="302" stroke="#5A6B7B" stroke-width="3"/>
  <polygon points="1740,318 1731,300 1749,300" fill="#5A6B7B"/>

  <!-- leaf 1 -->
  <rect x="90" y="320" width="340" height="190" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
  <text x="260" y="362" text-anchor="middle" font-size="24" font-weight="bold" fill="#2E7D32">穩定 7×24 生產</text>
  <text x="260" y="402" text-anchor="middle" font-size="20" fill="#333333">包年包月 / 節省計劃</text>
  <text x="260" y="438" text-anchor="middle" font-size="19" fill="#555555">鎖定算力基線換折扣</text>
  <text x="260" y="468" text-anchor="middle" font-size="19" fill="#555555">適合規格明確不變</text>

  <!-- leaf 2 -->
  <rect x="460" y="320" width="340" height="190" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/>
  <text x="630" y="362" text-anchor="middle" font-size="24" font-weight="bold" fill="#1565C0">白天型辦公 / 測試</text>
  <text x="630" y="402" text-anchor="middle" font-size="20" fill="#333333">按量 + 定時啟停</text>
  <text x="630" y="438" text-anchor="middle" font-size="19" fill="#555555">OOS 夜間週末自動 Stop</text>
  <text x="630" y="468" text-anchor="middle" font-size="19" fill="#555555">只為實際使用時段付費</text>

  <!-- leaf 3 -->
  <rect x="830" y="320" width="340" height="190" rx="12" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/>
  <text x="1000" y="362" text-anchor="middle" font-size="24" font-weight="bold" fill="#EF6C00">有波動、峰值不可測</text>
  <text x="1000" y="402" text-anchor="middle" font-size="20" fill="#333333">按量 + 彈性伸縮</text>
  <text x="1000" y="438" text-anchor="middle" font-size="19" fill="#555555">ESS / HPA 跟隨負載</text>
  <text x="1000" y="468" text-anchor="middle" font-size="19" fill="#555555">峰值時段才付費</text>

  <!-- leaf 4 -->
  <rect x="1200" y="320" width="340" height="190" rx="12" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/>
  <text x="1370" y="362" text-anchor="middle" font-size="24" font-weight="bold" fill="#6A1B9A">可中斷的批量任務</text>
  <text x="1370" y="402" text-anchor="middle" font-size="20" fill="#333333">搶占式實例</text>
  <text x="1370" y="438" text-anchor="middle" font-size="19" fill="#555555">單價顯著低於按量</text>
  <text x="1370" y="468" text-anchor="middle" font-size="19" fill="#555555">須設計 checkpoint 重試</text>

  <!-- leaf 5 -->
  <rect x="1570" y="320" width="340" height="190" rx="12" fill="#E0F2F1" stroke="#00695C" stroke-width="3"/>
  <text x="1740" y="362" text-anchor="middle" font-size="24" font-weight="bold" fill="#00695C">事件驅動零星調用</text>
  <text x="1740" y="402" text-anchor="middle" font-size="20" fill="#333333">函數計算 FC</text>
  <text x="1740" y="438" text-anchor="middle" font-size="19" fill="#555555">按調用次數計費</text>
  <text x="1740" y="468" text-anchor="middle" font-size="19" fill="#555555">閒時零成本</text>

  <!-- note band -->
  <rect x="90" y="560" width="1820" height="100" rx="12" fill="#FFF8E1" stroke="#F0C36D" stroke-width="2"/>
  <text x="1000" y="600" text-anchor="middle" font-size="20" fill="#6B4E00">每月復核兩個指標：節省計劃「覆蓋率」（抵了多少基線）與「利用率」（買的額度用了多少）；</text>
  <text x="1000" y="634" text-anchor="middle" font-size="20" fill="#6B4E00">未打標籤資源每月列榜認領 —— 未打標籤 = 成本黑洞。</text>
</svg>
