<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="880" viewBox="0 0 2000 880" font-family="'Heiti TC','Noto Sans SC','Hiragino Sans GB','PingFang TC',sans-serif">
  <rect x="0" y="0" width="2000" height="880" fill="#F2F5F9"/>
  <text x="1000" y="48" text-anchor="middle" font-size="34" font-weight="bold" fill="#16324F">阿里雲 Higress AI Gateway 組件架構</text>

  <!-- consumers -->
  <rect x="140" y="100" width="360" height="80" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/>
  <text x="320" y="148" text-anchor="middle" font-size="24" font-weight="bold" fill="#1565C0">客服系統</text>
  <rect x="560" y="100" width="360" height="80" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/>
  <text x="740" y="148" text-anchor="middle" font-size="24" font-weight="bold" fill="#1565C0">內部工具</text>
  <rect x="980" y="100" width="360" height="80" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/>
  <text x="1160" y="148" text-anchor="middle" font-size="24" font-weight="bold" fill="#1565C0">Agent（MCP 客戶端）</text>

  <!-- observability -->
  <rect x="1560" y="100" width="360" height="80" rx="12" fill="#ECEFF1" stroke="#546E7A" stroke-width="3"/>
  <text x="1740" y="134" text-anchor="middle" font-size="22" font-weight="bold" fill="#37474F">可觀測與審計</text>
  <text x="1740" y="164" text-anchor="middle" font-size="18" fill="#546E7A">token 計量 · 延遲 · 告警</text>

  <!-- consumer arrows -->
  <line x1="320" y1="180" x2="320" y2="262" stroke="#1565C0" stroke-width="3"/>
  <polygon points="320,278 311,260 329,260" fill="#1565C0"/>
  <line x1="740" y1="180" x2="740" y2="262" stroke="#1565C0" stroke-width="3"/>
  <polygon points="740,278 731,260 749,260" fill="#1565C0"/>
  <line x1="1160" y1="180" x2="1160" y2="262" stroke="#1565C0" stroke-width="3"/>
  <polygon points="1160,278 1151,260 1169,260" fill="#1565C0"/>
  <text x="345" y="230" font-size="18" fill="#1565C0">統一 base_url（OpenAI 契約）</text>

  <!-- gateway -->
  <rect x="140" y="280" width="1200" height="280" rx="14" fill="#FFFFFF" stroke="#1F4E79" stroke-width="4"/>
  <text x="170" y="330" font-size="26" font-weight="bold" fill="#1F4E79">Higress AI Gateway（基於 Istio + Envoy）</text>
  <text x="170" y="362" font-size="18" fill="#5A6B7B">插件鏈按序執行：認證 → 脫敏 → 限流 → 緩存 → 代理 → 統計</text>

  <rect x="160" y="400" width="180" height="60" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="250" y="437" text-anchor="middle" font-size="19" fill="#2E7D32">key-auth</text>
  <rect x="355" y="400" width="180" height="60" rx="10" fill="#FCE4EC" stroke="#C2185B" stroke-width="2"/>
  <text x="445" y="437" text-anchor="middle" font-size="19" fill="#C2185B">ai-data-masking</text>
  <rect x="550" y="400" width="180" height="60" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
  <text x="640" y="437" text-anchor="middle" font-size="19" fill="#EF6C00">ai-token-ratelimit</text>
  <rect x="745" y="400" width="180" height="60" rx="10" fill="#E0F2F1" stroke="#00695C" stroke-width="2"/>
  <text x="835" y="437" text-anchor="middle" font-size="19" fill="#00695C">ai-cache</text>
  <rect x="940" y="400" width="180" height="60" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="1030" y="437" text-anchor="middle" font-size="19" fill="#1565C0">ai-proxy</text>
  <rect x="1135" y="400" width="180" height="60" rx="10" fill="#ECEFF1" stroke="#546E7A" stroke-width="2"/>
  <text x="1225" y="437" text-anchor="middle" font-size="19" fill="#37474F">ai-statistics</text>
  <line x1="340" y1="430" x2="351" y2="430" stroke="#5A6B7B" stroke-width="2"/>
  <line x1="535" y1="430" x2="546" y2="430" stroke="#5A6B7B" stroke-width="2"/>
  <line x1="730" y1="430" x2="741" y2="430" stroke="#5A6B7B" stroke-width="2"/>
  <line x1="925" y1="430" x2="936" y2="430" stroke="#5A6B7B" stroke-width="2"/>
  <line x1="1120" y1="430" x2="1131" y2="430" stroke="#5A6B7B" stroke-width="2"/>
  <text x="170" y="520" font-size="18" fill="#5A6B7B">MCP Server 托管：內部工具（查訂單 / 查庫存）以 MCP 形式掛入，Agent 工具調用復用同一套治理</text>

  <!-- console -->
  <rect x="1560" y="280" width="360" height="120" rx="12" fill="#FFF8E1" stroke="#F0C36D" stroke-width="3"/>
  <text x="1740" y="328" text-anchor="middle" font-size="22" font-weight="bold" fill="#6B4E00">控制台 :8001</text>
  <text x="1740" y="362" text-anchor="middle" font-size="18" fill="#6B4E00">路由 / 插件 / AI 服務配置</text>
  <line x1="1740" y1="400" x2="1740" y2="430" stroke="#F0C36D" stroke-width="3" stroke-dasharray="8 5"/>
  <line x1="1740" y1="430" x2="1362" y2="430" stroke="#F0C36D" stroke-width="3" stroke-dasharray="8 5"/>
  <polygon points="1344,430 1362,421 1362,439" fill="#F0C36D"/>
  <text x="1470" y="418" font-size="17" fill="#6B4E00">配置下發</text>

  <!-- gateway -> observability (routed above the console box) -->
  <line x1="1340" y1="310" x2="1450" y2="310" stroke="#546E7A" stroke-width="3"/>
  <line x1="1450" y1="310" x2="1450" y2="140" stroke="#546E7A" stroke-width="3"/>
  <line x1="1450" y1="140" x2="1542" y2="140" stroke="#546E7A" stroke-width="3"/>
  <polygon points="1558,140 1540,131 1540,149" fill="#546E7A"/>
  <text x="1466" y="240" font-size="17" fill="#546E7A">ai-statistics</text>
  <text x="1466" y="262" font-size="17" fill="#546E7A">指標輸出</text>

  <!-- bottom row arrows -->
  <line x1="320" y1="560" x2="320" y2="642" stroke="#5A6B7B" stroke-width="3"/>
  <polygon points="320,658 311,640 329,640" fill="#5A6B7B"/>
  <text x="340" y="615" font-size="17" fill="#5A6B7B">限流計數 / 緩存讀寫</text>
  <line x1="690" y1="560" x2="690" y2="642" stroke="#1565C0" stroke-width="3"/>
  <polygon points="690,658 681,640 699,640" fill="#1565C0"/>
  <text x="710" y="615" font-size="17" fill="#1565C0">ai-proxy 統一協議</text>
  <line x1="1070" y1="560" x2="1070" y2="642" stroke="#D0021B" stroke-width="3" stroke-dasharray="8 5"/>
  <polygon points="1070,658 1061,640 1079,640" fill="#D0021B"/>
  <text x="1090" y="615" font-size="17" fill="#D0021B">fallback</text>
  <line x1="1300" y1="560" x2="1300" y2="600" stroke="#6A1B9A" stroke-width="3"/>
  <line x1="1300" y1="600" x2="1740" y2="600" stroke="#6A1B9A" stroke-width="3"/>
  <line x1="1740" y1="600" x2="1740" y2="642" stroke="#6A1B9A" stroke-width="3"/>
  <polygon points="1740,658 1731,640 1749,640" fill="#6A1B9A"/>
  <text x="1360" y="588" font-size="17" fill="#6A1B9A">Agent 工具調用（MCP）</text>

  <rect x="140" y="660" width="360" height="110" rx="12" fill="#ECEFF1" stroke="#546E7A" stroke-width="3"/>
  <text x="320" y="704" text-anchor="middle" font-size="22" font-weight="bold" fill="#37474F">Redis</text>
  <text x="320" y="738" text-anchor="middle" font-size="18" fill="#546E7A">限流計數 / 緩存存儲</text>
  <rect x="520" y="660" width="340" height="110" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
  <text x="690" y="704" text-anchor="middle" font-size="22" font-weight="bold" fill="#2E7D32">百煉（新加坡）</text>
  <text x="690" y="738" text-anchor="middle" font-size="18" fill="#2E7D32">qwen-plus / qwen-max</text>
  <rect x="900" y="660" width="340" height="110" rx="12" fill="#FFEBEE" stroke="#D0021B" stroke-width="3"/>
  <text x="1070" y="704" text-anchor="middle" font-size="22" font-weight="bold" fill="#D0021B">備用供應商</text>
  <text x="1070" y="738" text-anchor="middle" font-size="18" fill="#D0021B">DeepSeek / Azure OpenAI</text>
  <rect x="1560" y="660" width="360" height="110" rx="12" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="3"/>
  <text x="1740" y="704" text-anchor="middle" font-size="22" font-weight="bold" fill="#6A1B9A">MCP Server 托管</text>
  <text x="1740" y="738" text-anchor="middle" font-size="18" fill="#6A1B9A">內部工具：查訂單 / 查庫存</text>

  <!-- footer note -->
  <rect x="140" y="800" width="1780" height="56" rx="10" fill="#EAF1F8" stroke="#B9CFE4" stroke-width="2"/>
  <text x="1030" y="835" text-anchor="middle" font-size="19" fill="#16324F">業務側只認一個入口與一套 API Key；模型、供應商、限流、緩存、脫敏全部收斂到網關插件鏈，替換模型不改業務代碼。</text>
</svg>
